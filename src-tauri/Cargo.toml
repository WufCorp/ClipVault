[package]
name = "clipvault"
version = "2.0.5"
description = "ClipVault — clipboard history for Windows"
authors = ["ClipVault"]
edition = "2021"

[lib]
name = "clipvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Проверка офлайн-лицензии (Ed25519): публичный ключ зашит в .exe.
ed25519-dalek = "2"
hex = "0.4"
regex = "1"        # regex-фасет поиска (Pro, 4.2)
getrandom = "0.2"  # соль мастер-пароля (Pro, 5.2)

rusqlite = { version = "0.40", features = ["bundled", "functions"] }
clipboard-master = "4"
clipboard-win = "5"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
base64 = "0.22"
dirs = "5"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Windows-специфичные API: источник (GetForegroundWindow) и DPAPI-шифрование.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
